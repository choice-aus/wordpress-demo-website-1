server {
    listen 80;
    server_name mysite1.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mysite1.test;

    ssl_certificate     /etc/nginx/certs/mysite1.test.pem;
    ssl_certificate_key /etc/nginx/certs/mysite1.test-key.pem;

    root /var/www/html;
    index index.php index.html;

    location = /wp-admin {
        return 301 $scheme://$http_host/wp/wp-admin/;
    }

    location = /wp/wp-admin {
        return 301 $scheme://$http_host/wp/wp-admin/;
    }

    location = /wp/wp-json {
        return 301 $scheme://$http_host/wp/wp-json/;
    }

    location /wp/wp-admin/ {
        try_files $uri $uri/ /wp/wp-admin/index.php?$args;
    }

    location ^~ /wp/wp-json/ {
        rewrite ^/wp/wp-json/(.*)$ /wp/index.php?rest_route=/$1 last;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/wp/index.php;
    }

    location / {
        try_files $uri /wp/index.php?$args;
    }

    location ^~ /wp-content/ {
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}