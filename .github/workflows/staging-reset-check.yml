
name: Staging reset readiness check

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check staging reset readiness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate readiness report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/staging_reset_check.py
