name: Close release cycle

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: Which completed release should be cleaned up?
        required: true
        default: latest
        type: choice
        options: [latest, specific]
      completed_release:
        description: Release branch (required for specific mode)
        type: string
      confirm_closed:
        description: I confirm the release cycle is closed
        type: boolean
        default: false
      preparation_only:
        description: Prepare and verify only; never reset staging or delete branches
        type: boolean
        default: true
      next_release:
        description: Optional new release-* branch to create from verified main after full cleanup
        type: string
        default: ''
      remove_candidate:
        description: Remove this run's temporary candidate immediately after verified staging promotion
        type: boolean
        default: true
  workflow_call:
    inputs:
      audit_mode:
        type: string
        default: latest
      completed_release:
        type: string
        default: ''
      confirm_closed:
        type: boolean
        default: false
      preparation_only:
        type: boolean
        default: true
      next_release:
        type: string
        default: ''
      remove_candidate:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

# Serialize release closure and recovery pruning across entry points.
concurrency:
  group: close-release-cycle
  cancel-in-progress: false

jobs:
  assessment:
    name: Assess release and record approved SHAs
    runs-on: ubuntu-latest
    outputs:
      # A failed-job retry must reuse the successful assessment's attempt.
      plan_artifact_name: release-cycle-plan-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Test release safety controls
        run: python3 -m unittest discover -s tests -v
      - name: Assess release cycle
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_MODE: ${{ inputs.audit_mode }}
          COMPLETED_RELEASE: ${{ inputs.completed_release }}
          NEXT_RELEASE: ${{ inputs.next_release }}
          REMOVE_CANDIDATE: ${{ inputs.remove_candidate }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_cycle.py assess \
            --audit-mode "$AUDIT_MODE" \
            --completed-release "$COMPLETED_RELEASE" \
            --next-release "$NEXT_RELEASE" \
            --remove-candidate "$REMOVE_CANDIDATE" | tee release-cycle-assessment.txt
          {
            echo '## Release cycle assessment'
            echo 'Review the release, preparation eligibility and branch SHAs before approval.'
            echo '```json'
            cat release-cycle-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-cycle-plan-${{ github.run_attempt }}
          path: release-cycle-plan.json
          if-no-files-found: error

  execute:
    name: Approved release-cycle operations
    needs: assessment
    if: ${{ inputs.confirm_closed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: branch-cleanup
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.assessment.outputs.plan_artifact_name }}
      - name: Validate cleanup identity and protected-operation rulesets
        env:
          CLEANUP_AUTH_MODE: ${{ vars.CLEANUP_AUTH_MODE || 'github-token' }}
          CLEANUP_ACTOR: ${{ vars.CLEANUP_ACTOR }}
          AUTOMATION_TOKEN: ${{ secrets.BRANCH_CLEANUP_TOKEN }}
          BUILTIN_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ vars.CLEANUP_AUTH_MODE == 'automation-token' && secrets.BRANCH_CLEANUP_TOKEN || github.token }}
        run: python3 .github/scripts/cleanup_auth.py
      - name: Revalidate, prepare and close approved release
        env:
          GH_TOKEN: ${{ vars.CLEANUP_AUTH_MODE == 'automation-token' && secrets.BRANCH_CLEANUP_TOKEN || github.token }}
          PREPARATION_ONLY: ${{ inputs.preparation_only }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -u .github/scripts/release_cycle.py execute \
            --preparation-only "$PREPARATION_ONLY" 2>&1 | tee release-cycle-result.txt
      - name: Preserve verification evidence, including failed carryovers
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-cycle-evidence-${{ github.run_attempt }}
          path: |
            release-cycle-plan.json
            carryover-manifest.json
            closure-receipt.json
            next-release-result.json
            promotion-receipt.json
            cleanup-auth-report.json
            release-cycle-result.txt
      - name: Report outcome
        if: ${{ always() }}
        run: |
          if [[ -f release-cycle-result.txt ]]; then
            cat release-cycle-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi
