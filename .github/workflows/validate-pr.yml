name: Validate PR source

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - staging
      - main
      - 'release-*'

  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'release-*'
      - main
      - staging
      - develop

permissions:
  contents: read

jobs:
  commit-titles:
    name: Commit title check
    if: ${{ github.event_name != 'push' || github.event.deleted != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate introduced commit titles
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            python3 .github/scripts/validate_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
          elif [[ "$BEFORE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            python3 .github/scripts/validate_commits.py --new-branch "$HEAD_SHA" --remote origin
          else
            # A force push can leave the previous tip outside normal clone history.
            if ! git cat-file -e "$BEFORE_SHA^{commit}"; then
              git fetch --no-tags origin "$BEFORE_SHA"
            fi
            python3 .github/scripts/validate_commits.py --range "$BEFORE_SHA..$HEAD_SHA"
          fi

  validate-source:
    name: Validate promotion path
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout PR source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Keep title validation in the existing required job during rollout of
      # the new dedicated required check; both use the same validator.
      - name: Validate commit titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/validate_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Check source and target branches
        if: github.event_name == 'pull_request'
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          python3 .github/scripts/development_policy.py --source "$SOURCE" --target "$TARGET"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 .github/scripts/validate_commits.py --title "$TITLE"
