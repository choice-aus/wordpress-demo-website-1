
name: Branch cleanup audit

on:
  workflow_dispatch:
    inputs:
      completed_release:
        description: 'Release branch whose cycle has been closed'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  audit:
    name: Audit branches
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate branch cleanup audit
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RELEASE: ${{ inputs.completed_release }}
        run: |
          python3 .github/scripts/branch_audit.py \
            --completed-release "$COMPLETED_RELEASE"
