
name: DEV-215 - Test repository write access

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-write:
    runs-on: ubuntu-latest

    steps:
      - name: Create test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MAIN_SHA=$(gh api \
            repos/${{ github.repository }}/git/ref/heads/main \
            --jq '.object.sha')

          BRANCH="demo/dev-215-write-test-${{ github.run_id }}"

          gh api \
            repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref="refs/heads/$BRANCH" \
            -f sha="$MAIN_SHA"

          echo "Created branch: $BRANCH"
          echo "Source commit: $MAIN_SHA"

          echo "### Repository write test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$MAIN_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
