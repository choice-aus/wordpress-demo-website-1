name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP and theme checks
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          find public/wp-content \
            -type f -name '*.php' \
            -print0 |
          xargs -0 -r -n1 php -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install theme dependencies
        working-directory: public/wp-content/themes/twentytwentyfive
        run: npm ci

      - name: Build theme
        working-directory: public/wp-content/themes/twentytwentyfive
        run: npm run build